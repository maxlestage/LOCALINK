# Builds the iOS app, signs it and sends it to TestFlight, so it can be installed on an
# iPhone with the TestFlight app: no Mac needed, everything runs on GitHub's macOS
# machines with an App Store Connect API key (Xcode's automatic signing in the cloud).
#
# One-time setup, from a phone (an Apple Developer account is required):
#   1. App Store Connect → Apps → + → New app: iOS, name LOCALINK, bundle ID
#      com.maxlestage.localink (create it in Certificates, Identifiers & Profiles if
#      it is not offered), SKU localink.
#   2. App Store Connect → Users and Access → Integrations → App Store Connect API →
#      generate a key with the "App Manager" role; note its Key ID and the Issuer ID,
#      download the .p8 file.
#   3. GitHub → Settings → Secrets and variables → Actions:
#        secret   APP_STORE_CONNECT_KEY_ID      the Key ID
#        secret   APP_STORE_CONNECT_ISSUER_ID   the Issuer ID
#        secret   APP_STORE_CONNECT_KEY         the content of the .p8 file
#        variable APPLE_TEAM_ID                 your Team ID (Membership details)
# Without them, the workflow stops with a notice. Started after every merge into
# master by ci.yml, and by hand: Actions → TestFlight → Run workflow.

name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build, sign and upload
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Check the setup
        id: setup
        working-directory: .
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::TestFlight is not configured: see the comments of .github/workflows/testflight.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.setup.outputs.ready == 'true'
      - name: Archive and upload
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY" > "$key_path"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key_path"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Localink.xcodeproj -scheme Localink -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Localink.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${auth[@]}" archive | xcbeautify --renderer github-actions
          xcodebuild -exportArchive -archivePath build/Localink.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            "${auth[@]}" | xcbeautify --renderer github-actions
          echo "### 🚀 Build $GITHUB_RUN_NUMBER sent to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$key_path"
